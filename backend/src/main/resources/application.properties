# ---------------------------------------------------------------
# ExamSphere configuration. Every secret comes from the environment.
# A .env file in the project root (or in backend/) is loaded automatically.
# ---------------------------------------------------------------
spring.application.name=examsphere
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# --- Database (MySQL 8+) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/examsphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- JWT ---
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION:7200000}

# --- Mail (optional locally; the app starts without it) ---
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${MAIL_FROM:ExamSphere <no-reply@examsphere.local>}
# Development helper only: when SMTP is NOT configured, print the verification /
# reset link to the console so the flow can still be completed locally. Keep false in production.
app.mail.dev-log-links=${APP_DEV_LOG_EMAIL_LINKS:false}

# --- Frontend / CORS ---
app.frontend-url=${FRONTEND_URL:http://localhost:8080}

# --- Token + throttling policy ---
app.verification.expiry-minutes=30
app.verification.resend-cooldown-seconds=60
app.verification.max-per-day=5
app.reset.expiry-minutes=30
app.login.max-failed-attempts=5
app.login.lock-minutes=15
app.attempt.grace-seconds=10

# --- Demo data ---
app.seed.enabled=${APP_SEED_ENABLED:true}

spring.jackson.default-property-inclusion=non_null
logging.level.com.examsphere=INFO

# The UI is packaged into the jar (classpath:/static). When the app is started from the
# backend folder it is also read straight from ../frontend, so UI edits show up on refresh.
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
